<!doctype html>
<meta charset="utf-8">
<title>Pen-Test — opendisplay-win</title>
<style>
  html, body { margin: 0; height: 100%; font: 16px system-ui, sans-serif; background: #111; color: #eee; }
  #hud { position: fixed; top: 0; left: 0; padding: 12px 16px; background: #000c; line-height: 1.6; }
  #hud b { display: inline-block; width: 9ch; color: #8cf; font-weight: 600; }
  canvas { display: block; touch-action: none; cursor: crosshair; }
</style>
<div id="hud">
  <div><b>Type</b><span id="type">—</span></div>
  <div><b>Pressure</b><span id="pressure">—</span></div>
  <div><b>Tilt X/Y</b><span id="tilt">—</span></div>
  <div><b>Hover</b><span id="hover">—</span></div>
  <div><b>Events</b><span id="count">0</span></div>
</div>
<canvas id="c"></canvas>
<script>
  // Title marker: pen_e2e_test.py finds this window by it and reads the pointer
  // data back out of the title, so it must stay in front on every update.
  const MARKER = 'Pen-Test';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const out = id => document.getElementById(id);
  // `downs` is reported separately so a test can tell a real click apart from
  // mere hover movement — a zero-pressure tap must still produce a pointerdown.
  let events = 0, downs = 0, last = null;

  function resize() {
    const img = ctx.getImageData(0, 0, canvas.width || 1, canvas.height || 1);
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    ctx.putImageData(img, 0, 0);
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#8cf';
  }
  addEventListener('resize', resize);
  resize();

  function report(e, hovering) {
    out('type').textContent = e.pointerType;
    out('pressure').textContent = e.pressure.toFixed(3);
    out('tilt').textContent = `${e.tiltX}° / ${e.tiltY}°`;
    out('hover').textContent = hovering ? 'yes (no contact)' : 'no (in contact)';
    out('count').textContent = ++events;
    document.title = `${MARKER} ${e.pointerType} p=${e.pressure.toFixed(2)} ` +
                     `t=${e.tiltX}/${e.tiltY} n=${events} d=${downs}`;
  }

  canvas.addEventListener('pointerdown', e => {
    downs++;
    last = { x: e.offsetX, y: e.offsetY };
    report(e, false);
  });
  canvas.addEventListener('pointerup', () => { last = null; });
  canvas.addEventListener('pointerleave', () => { last = null; });

  canvas.addEventListener('pointermove', e => {
    const down = e.buttons !== 0;
    report(e, !down);
    if (!down || !last) { last = down ? { x: e.offsetX, y: e.offsetY } : null; return; }
    // Stroke width follows pressure: a flat line means only mouse input arrives.
    ctx.lineWidth = 1 + e.pressure * 24;
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
    last = { x: e.offsetX, y: e.offsetY };
  });
</script>
